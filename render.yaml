services:
  - type: web
    name: bromelo-moderator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: OWNER_ID
        value: "8668633782"
      - key: OWNER_USERNAME
        value: "devBroMelo"
      - key: ALLOWED_CHAT_ID
        value: "0"
      - key: AUTO_DELETE_SECONDS
        value: "20"
      - key: AUTO_MUTE_WARN_COUNT
        value: "3"
      - key: AUTO_MUTE_MINUTES
        value: "5"
      - key: FAMILY_MUTE_MINUTES
        value: "120"
